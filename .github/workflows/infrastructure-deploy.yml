name: "Infrastructure Deployment"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    env:
      # AWS Credentials
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      
      # App & Data Secrets
      TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}
      TF_VAR_redis_url: ${{ secrets.REDIS_URL }}
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      
      # Networking Configuration (Matching your VPC/Subnets)
      TF_VAR_vpc_id: "vpc-00a647cfeb5f1d1d1"
      TF_VAR_public_subnets: '["subnet-0a36170adff420861", "subnet-027ea607175013eb5"]'
      TF_VAR_public_subnet_cidrs: '["10.0.0.0/24", "10.0.1.0/24"]'
      TF_VAR_private_subnet_cidrs: '["10.0.3.0/24", "10.0.4.0/24"]'
      TF_VAR_azs: '["us-east-1a", "us-east-1b"]'

      # General Settings
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_ami_id: "ami-04b70fa74e45c3917"
      TF_VAR_environment: "dev"
      TF_VAR_instance_type: "t2.micro"
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./terraform

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false
        working-directory: ./terraform

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform
