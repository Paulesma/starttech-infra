name: 'Force Burn Everything Down'
on:
  push:
    branches:
      - main  # Or whatever your primary branch name is

jobs:
  destroy-all:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1 # Change this if your infra is in a different region
        # This uses your existing GitHub secret variables
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init

    # This forcefully empties the stubborn S3 buckets using GitHub's high-level permissions
    - name: Force Empty S3 Buckets
      run: |
        aws s3 rm s3://starttech-frontend-dev --recursive || true
        aws s3 rm s3://starttech-bucket10 --recursive || true

    # This deletes the ECR images so the ECR repository doesn't get stuck
    - name: Force Clean ECR Images
      run: |
        aws ecr delete-repository --repository-name starttech-backend --force || true

    # This commands Terraform to completely tear down everything left in the state file
    - name: Run Final Destruction
      run: terraform destroy -auto-approve
      